<!DOCTYPE html>
<html>
<head>
    <title>K8s Manager - 登录</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            /* ✅ 背景用深色渐变 + 光晕，不再“秃” */
            background: radial-gradient(circle at 10% 30%, #1e2a3a 0%, #0f1724 100%);
            position: relative;
            padding: 20px;
        }

        /* ✅ 背景装饰光晕（ Kuboard 科技感 ） */
        body::before {
            content: '';
            position: fixed;
            top: -30%;
            left: -10%;
            width: 70%;
            height: 90%;
            background: radial-gradient(circle, rgba(74, 144, 226, 0.20) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: -20%;
            right: -10%;
            width: 60%;
            height: 80%;
            background: radial-gradient(circle, rgba(74, 144, 226, 0.10) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        /* ✅ 卡片更大、更饱满 */
        .login-container {
            display: flex;
            width: 1024px;
            max-width: 96vw;
            min-height: 600px;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.60);
            background: #ffffff;
            position: relative;
            z-index: 1;

            /* 卡片微微浮起 */
            transform: perspective(1200px) rotateX(0.5deg);
            transition: transform 0.3s ease;
        }

        .login-container:hover {
            transform: perspective(1200px) rotateX(0deg);
        }

        /* ===== 左侧品牌区（占比更大） ===== */
        .login-left {
            flex: 0 0 440px;
            background: linear-gradient(145deg, #19232f 0%, #263545 100%);
            padding: 56px 44px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        /* 光晕装饰（更丰富） */
        .login-left::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -30%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(74, 144, 226, 0.18) 0%, transparent 70%);
            border-radius: 50%;
        }

        .login-left::after {
            content: '';
            position: absolute;
            bottom: -20%;
            left: -20%;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(74, 144, 226, 0.08) 0%, transparent 70%);
            border-radius: 50%;
        }

        .login-left .brand {
            position: relative;
            z-index: 1;
        }

        .login-left .brand .logo-icon {
            font-size: 48px;
            display: block;
            margin-bottom: 18px;
        }

        .login-left .brand h1 {
            color: #ffffff;
            font-size: 30px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .login-left .brand h1 span {
            color: #4a90e2;
        }

        .login-left .brand p {
            color: rgba(255, 255, 255, 0.55);
            font-size: 15px;
            margin-top: 12px;
            line-height: 1.7;
        }

        .login-left .feature-list {
            position: relative;
            z-index: 1;
            margin-top: 40px;
        }

        .login-left .feature-list .item {
            display: flex;
            align-items: center;
            gap: 14px;
            color: rgba(255, 255, 255, 0.75);
            font-size: 15px;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .login-left .feature-list .item:last-child {
            border-bottom: none;
        }

        .login-left .feature-list .item .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #4a90e2;
            flex-shrink: 0;
            box-shadow: 0 0 8px rgba(74, 144, 226, 0.5);
        }

        .login-left .footer-info {
            position: relative;
            z-index: 1;
            color: rgba(255, 255, 255, 0.25);
            font-size: 13px;
            margin-top: 30px;
        }

        /* ===== 右侧登录区 ===== */
        .login-right {
            flex: 1;
            padding: 56px 48px;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .login-right .welcome {
            margin-bottom: 32px;
        }

        .login-right .welcome h2 {
            font-size: 26px;
            font-weight: 700;
            color: #1a2332;
        }

        .login-right .welcome p {
            color: #8c8f9c;
            font-size: 15px;
            margin-top: 8px;
        }

        .login-right .input-group {
            margin-bottom: 20px;
        }

        .login-right .input-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #3d4050;
            margin-bottom: 6px;
        }

        .login-right .input-group input {
            width: 100%;
            padding: 14px 18px;
            border: 1.5px solid #e4e7ed;
            border-radius: 10px;
            font-size: 15px;
            transition: border-color 0.25s, box-shadow 0.25s;
            background: #f8f9fc;
            outline: none;
        }

        .login-right .input-group input:focus {
            border-color: #4a90e2;
            box-shadow: 0 0 0 4px rgba(74, 144, 226, 0.10);
            background: #ffffff;
        }

        .login-right .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            color: #6b6f80;
            margin: 6px 0 26px 0;
        }

        .login-right .options a {
            color: #4a90e2;
            text-decoration: none;
            font-weight: 500;
        }
        .login-right .options a:hover { text-decoration: underline; }

        .login-right .login-btn {
            width: 100%;
            padding: 14px;
            background: #4a90e2;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.25s, transform 0.1s, box-shadow 0.25s;
            box-shadow: 0 4px 14px rgba(74, 144, 226, 0.30);
        }

        .login-right .login-btn:hover {
            background: #3a7bc8;
            box-shadow: 0 6px 20px rgba(74, 144, 226, 0.40);
        }
        .login-right .login-btn:active { transform: scale(0.97); }

        .login-right .error-msg {
            color: #e74c3c;
            text-align: center;
            font-size: 14px;
            margin-top: 18px;
            min-height: 22px;
        }

        /* ===== 响应式（平板/手机） ===== */
        @media (max-width: 860px) {
            .login-container {
                flex-direction: column;
                width: 100%;
                max-width: 440px;
                min-height: auto;
                border-radius: 20px;
            }
            .login-left {
                flex: 0 0 auto;
                padding: 32px 28px;
                min-height: 200px;
            }
            .login-left .feature-list { display: none; }
            .login-left .footer-info { margin-top: 12px; }
            .login-right { padding: 32px 28px; }
            .login-left .brand .logo-icon { font-size: 36px; }
            .login-left .brand h1 { font-size: 24px; }
        }

        @media (max-width: 480px) {
            body { padding: 12px; }
            .login-container { border-radius: 16px; }
            .login-right { padding: 24px 18px; }
            .login-left { padding: 24px 18px; }
        }
    </style>
</head>
<body>

<div class="login-container">

    <!-- 左侧品牌区 -->
    <div class="login-left">
        <div class="brand">
            <span class="logo-icon">☸️</span>
            <h1>K8s <span>Manager</span></h1>
            <p>集群运维 · 开发测试<br>一站式管理平台</p>
        </div>

        <div class="feature-list">
            <div class="item"><span class="dot"></span> 多集群统一管理</div>
            <div class="item"><span class="dot"></span> 容器调度与编排</div>
            <div class="item"><span class="dot"></span> 镜像仓库 &amp; CI/CD</div>
            <div class="item"><span class="dot"></span> 实时监控 &amp; 日志</div>
        </div>

        <div class="footer-info">© 2026 东方算芯 · ecosda</div>
    </div>

    <!-- 右侧登录表单 -->
    <div class="login-right">
        <div class="welcome">
            <h2>欢迎回来</h2>
            <p>请输入您的账号信息登录</p>
        </div>

        <div class="input-group">
            <label>用户名</label>
            <input type="text" id="username" placeholder="请输入用户名" value="zhangyunan">
        </div>

        <div class="input-group">
            <label>密码</label>
            <input type="password" id="password" placeholder="请输入密码" value="zhangyunan@123">
        </div>

        <div class="options">
            <label style="display:flex;align-items:center;gap:6px;cursor:pointer;">
                <input type="checkbox" checked> 记住我
            </label>
            <a href="#">忘记密码？</a>
        </div>

        <button class="login-btn" onclick="login()">登 录</button>
        <div id="error" class="error-msg"></div>
    </div>

</div>

<script>
async function login() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();

    if (!username || !password) {
        document.getElementById('error').textContent = '请输入用户名和密码';
        return;
    }

    try {
        const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (data.code === 0) {
            localStorage.setItem('token', data.data.token);
            localStorage.setItem('user', JSON.stringify(data.data.user));
            window.location.href = '/index.html';
        } else {
            document.getElementById('error').textContent = data.message || '登录失败';
        }
    } catch (e) {
        document.getElementById('error').textContent = '网络错误，请稍后重试';
    }
}

document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') login();
});
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>K8s 集群管理面板</title>
    <meta charset="utf-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
        h1 { color: #1a1a2e; margin-bottom: 20px; }
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .stat-card h3 { color: #666; font-size: 14px; margin-bottom: 10px; }
        .stat-card .number { font-size: 32px; font-weight: bold; color: #1a1a2e; }
        .section { background: white; border-radius: 12px; padding: 20px; margin-bottom: 30px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .section h2 { margin-bottom: 20px; color: #1a1a2e; font-size: 18px; border-left: 4px solid #4a90e2; padding-left: 12px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #f8f9fa; font-weight: 600; color: #666; }
        .status-ready, .status-running { color: #28a745; font-weight: 500; }
        .status-not-ready, .status-pending { color: #ffc107; }
        .status-failed { color: #dc3545; }
        .refresh-btn { background: #4a90e2; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; margin-bottom: 20px; }
        .refresh-btn:hover { background: #3a7bc8; }
        .note { color: #666; font-size: 12px; margin-top: 20px; text-align: center; padding: 10px; border-top: 1px solid #eee; }
    </style>
</head>
<body>
<div class="container">
    <h1>☸️ Kubernetes 集群管理面板</h1>
    <button class="refresh-btn" onclick="fetchAllData()">🔄 刷新数据</button>
    
    <div class="stats" id="stats">
        <div class="stat-card"><h3>节点数</h3><div class="number" id="nodeCount">-</div></div>
        <div class="stat-card"><h3>Pod 总数</h3><div class="number" id="podCount">-</div></div>
        <div class="stat-card"><h3>运行中 Pod</h3><div class="number" id="runningCount">-</div></div>
        <div class="stat-card"><h3>Deployments</h3><div class="number" id="deployCount">-</div></div>
    </div>
    
    <div class="section">
        <h2>🖥️ 节点列表</h2>
        <div id="nodesTable">加载中...</div>
    </div>
    
    <div class="section">
        <h2>📦 Pods 列表</h2>
        <div id="podsTable">加载中...</div>
    </div>
    
    <div class="note">
        ⚠️ 只读模式 | 仅用于查看集群状态
    </div>
</div>

<script>
    const API_BASE = '/api';
    
    async function fetchAllData() {
        try {
            await Promise.all([
                fetchSummary(),
                fetchNodes(),
                fetchPods()
            ]);
        } catch (err) {
            console.error('数据加载失败:', err);
        }
    }
    
    async function fetchSummary() {
        const res = await fetch(`${API_BASE}/summary`);
        const data = await res.json();
        document.getElementById('nodeCount').innerText = data.nodeCount || 0;
        document.getElementById('podCount').innerText = data.podCount || 0;
        document.getElementById('runningCount').innerText = data.runningPods || 0;
        document.getElementById('deployCount').innerText = data.deployCount || 0;
    }
    
    async function fetchNodes() {
        const res = await fetch(`${API_BASE}/nodes`);
        const nodes = await res.json();
        let html = `<table><thead><tr><th>节点名称</th><th>状态</th><th>Kubelet 版本</th><th>操作系统</th></tr></thead><tbody>`;
        nodes.forEach(node => {
            const statusClass = node.status === 'Ready' ? 'status-ready' : 'status-not-ready';
            html += `<tr><td>${node.name}</td><td class="${statusClass}">${node.status}</td><td>${node.kubelet || '-'}</td><td>${node.os || '-'}</td></tr>`;
        });
        html += `</tbody>~`;
        document.getElementById('nodesTable').innerHTML = html;
    }
    
    async function fetchPods() {
        const res = await fetch(`${API_BASE}/pods`);
        const pods = await res.json();
        let html = `<table><thead><tr><th>Pod 名称</th><th>命名空间</th><th>状态</th><th>IP</th><th>节点</th></tr></thead><tbody>`;
        pods.forEach(pod => {
            let statusClass = pod.status === 'Running' ? 'status-running' : (pod.status === 'Pending' ? 'status-pending' : 'status-failed');
            html += `<tr>
                <td>${pod.name}</td>
                <td>${pod.namespace}</td>
                <td class="${statusClass}">${pod.status}</td>
                <td>${pod.ip || '-'}</td>
                <td>${pod.node || '-'}</td>
            </tr>`;
        });
        html += `</tbody>~`;
        document.getElementById('podsTable').innerHTML = html;
    }
    
    // 自动刷新（每30秒）
    fetchAllData();
    setInterval(fetchAllData, 30000);
</script>
</body>
</html>

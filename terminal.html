<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>K8s Web Terminal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; }
        .main-layout { display: flex; width: 100%; height: 100%; }
        
        /* 左侧文件浏览器 */
        .file-sidebar {
            width: 280px;
            background: #f5f5f5;
            border-right: 1px solid #ddd;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: width 0.2s ease;
            flex-shrink: 0;
        }
        .file-sidebar.collapsed { width: 48px; }
        .file-sidebar.collapsed .sidebar-header span:first-child,
        .file-sidebar.collapsed .file-tree,
        .file-sidebar.collapsed .current-path { display: none; }
        
        .sidebar-header {
            padding: 10px 12px;
            background: #e8e8e8;
            border-bottom: 1px solid #ddd;
            font-weight: bold;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .sidebar-header button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            padding: 4px 8px;
            border-radius: 4px;
        }
        .sidebar-header button:hover { background: #ccc; }
        
        .file-tree {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
            font-size: 12px;
            font-family: monospace;
        }
        .file-item {
            padding: 6px 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }
        .file-item:hover { background: #e0e0e0; }
        .file-item.dir { color: #1890ff; }
        .file-item.file { color: #333; }
        .file-item .icon { font-size: 14px; width: 20px; flex-shrink: 0; }
        .file-item .name { overflow: hidden; text-overflow: ellipsis; }
        
        .current-path {
            padding: 8px 12px;
            background: #e8e8e8;
            border-top: 1px solid #ddd;
            font-size: 11px;
            font-family: monospace;
            flex-shrink: 0;
        }
        
        /* 右侧终端 */
        .terminal-area { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        #terminal { flex: 1; padding: 10px; }
        .status-bar {
            height: 40px;
            background: #f0f0f0;
            color: #333;
            padding: 0 12px;
            font-size: 12px;
            font-family: monospace;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #ccc;
            flex-shrink: 0;
        }
        .connected { color: #2e7d32; }
        .disconnected { color: #c62828; }
        .theme-btn, .refresh-btn {
            background: #1890ff;
            border: none;
            color: white;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            margin-left: 8px;
        }
        .refresh-btn { background: #52c41a; }
        .refresh-btn:hover { background: #73d13d; }
        .theme-btn:hover { background: #40a9ff; }
        .status-left { display: flex; align-items: center; gap: 15px; }
        
        /* 暗色主题 */
        body.dark .file-sidebar {
            background: #252526;
            border-right-color: #3e3e42;
        }
        body.dark .sidebar-header {
            background: #2d2d30;
            border-bottom-color: #3e3e42;
            color: #ccc;
        }
        body.dark .file-item:hover { background: #2a2d2e; }
        body.dark .file-item.file { color: #ccc; }
        body.dark .current-path {
            background: #2d2d30;
            border-top-color: #3e3e42;
            color: #ccc;
        }
        body.dark .status-bar {
            background: #2d2d30;
            border-top-color: #3e3e42;
            color: #ccc;
        }
        .loading { text-align: center; padding: 20px; color: #999; }
        .right-buttons { display: flex; align-items: center; }
    </style>
</head>
<body>
<div class="main-layout">
    <div class="file-sidebar" id="fileSidebar">
        <div class="sidebar-header">
            <span>📁 文件浏览器</span>
            <button id="collapseBtn" title="收起">◀</button>
        </div>
        <div class="file-tree" id="fileTree">
            <div class="loading">加载中...</div>
        </div>
        <div class="current-path">
            <span>📂 </span><span id="currentDirPath">/</span>
        </div>
    </div>

    <div class="terminal-area">
        <div id="terminal"></div>
        <div class="status-bar">
            <div class="status-left">
                <span id="statusText">⚡ 连接中...</span>
                <span id="sizeInfo"></span>
            </div>
            <div class="right-buttons">
                <button id="refreshFileBtn" class="refresh-btn">🔄 刷新文件</button>
                <button id="themeToggleBtn" class="theme-btn">🌙 深色</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js"></script>
<script>
    const urlParams = new URLSearchParams(window.location.search);
    const namespace = urlParams.get("namespace") || 'cattle-system';
    const pod = urlParams.get("pod");
    const container = urlParams.get("container") || 'app';
    // 使用正确的 API 地址（后端端口 8000，但通过 nginx 代理，所以用相对路径）
    const API_BASE = '';

    if (!pod) {
        document.getElementById('statusText').innerHTML = '❌ 缺少 pod 参数';
    }

    // ========== 主题 ==========
    const lightTheme = {
        background: "#ffffff",
        foreground: "#000000",
        cursor: "#000000",
        cursorAccent: "#ffffff",
        selection: "rgba(0, 0, 0, 0.3)"
    };
    const darkTheme = {
        background: "#1e1e1e",
        foreground: "#d4d4d4",
        cursor: "#d4d4d4",
        cursorAccent: "#1e1e1e",
        selection: "rgba(255, 255, 255, 0.3)"
    };
    let currentTheme = 'light';
    let currentDir = '/';

    // ========== 终端大小计算 ==========
    function calcSize() {
        const sidebar = document.getElementById('fileSidebar');
        const sidebarWidth = sidebar.classList.contains('collapsed') ? 48 : 280;
        const winWidth = window.innerWidth - sidebarWidth - 20;
        const winHeight = window.innerHeight - 60;
        let fontSize = 12;
        if (winWidth > 2000) fontSize = 13;
        else if (winWidth > 1200) fontSize = 12;
        else fontSize = 11;
        
        const charWidth = fontSize * 0.6;
        const charHeight = fontSize * 1.2;
        
        let cols = Math.floor(winWidth / charWidth);
        let rows = Math.floor(winHeight / charHeight);
        cols = Math.max(cols, 60);
        rows = Math.max(rows, 20);
        
        return { cols, rows, fontSize };
    }

    // ========== 终端初始化 ==========
    let { cols, rows, fontSize } = calcSize();
    
    const term = new Terminal({
        cursorBlink: true,
        fontSize: fontSize,
        fontFamily: 'Menlo, Monaco, "Courier New", monospace',
        theme: lightTheme,
        convertEol: true,
        scrollback: 10000
    });

    term.open(document.getElementById("terminal"));
    term.resize(cols, rows);
    term.focus();

    // ========== 主题切换 ==========
    function toggleTheme() {
        if (currentTheme === 'light') {
            term.options.theme = darkTheme;
            currentTheme = 'dark';
            document.getElementById('themeToggleBtn').innerHTML = '☀️ 亮色';
            document.body.classList.add('dark');
        } else {
            term.options.theme = lightTheme;
            currentTheme = 'light';
            document.getElementById('themeToggleBtn').innerHTML = '🌙 深色';
            document.body.classList.remove('dark');
        }
        term.refresh(0, term.rows - 1);
    }

    // ========== 侧边栏 ==========
    function initSidebar() {
        const sidebar = document.getElementById('fileSidebar');
        const collapseBtn = document.getElementById('collapseBtn');
        
        collapseBtn.addEventListener('click', () => {
            const isCollapsed = sidebar.classList.toggle('collapsed');
            collapseBtn.innerHTML = isCollapsed ? '▶' : '◀';
            collapseBtn.title = isCollapsed ? '展开' : '收起';
            setTimeout(() => {
                const { cols: newCols, rows: newRows, fontSize: newFontSize } = calcSize();
                if (term.options.fontSize !== newFontSize) term.options.fontSize = newFontSize;
                term.resize(newCols, newRows);
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ operation: "resize", cols: newCols, rows: newRows }));
                }
                updateSizeInfo();
            }, 200);
        });
    }

    // ========== 文件浏览器 API ==========
    async function listDirectory(path) {
        try {
            // 使用正确的 API 格式
            const apiUrl = `/api/pods/${namespace}/${pod}/files/list?path=${encodeURIComponent(path)}`;
            console.log('Fetching:', apiUrl);
            const response = await fetch(apiUrl);
            if (!response.ok) return [];
            const data = await response.json();
            console.log('Files:', data);
            // API 返回格式: [{"isDir":true,"name":"bin","path":"/bin"}, ...]
            if (Array.isArray(data)) return data;
            return [];
        } catch (e) {
            console.error('List directory error:', e);
            return [];
        }
    }

    async function viewFile(filePath) {
        try {
            const response = await fetch(`/api/pods/${namespace}/${pod}/files/view?path=${encodeURIComponent(filePath)}`);
            const content = await response.text();
            
            term.write(`\r\n\x1b[36m📄 文件: ${filePath}\x1b[0m\r\n`);
            term.write(`\x1b[90m${'='.repeat(60)}\x1b[0m\r\n`);
            const maxLen = 3000;
            const displayContent = content.length > maxLen ? content.substring(0, maxLen) + '\n... (文件过大，仅显示前3000字符)' : content;
            term.write(displayContent);
            term.write(`\r\n\x1b[90m${'='.repeat(60)}\x1b[0m\r\n`);
            term.write("# ");
        } catch (e) {
            term.write(`\r\n\x1b[31m❌ 读取文件失败: ${e.message}\x1b[0m\r\n# `);
        }
    }

    function renderFileTree(path, files) {
        const container = document.getElementById('fileTree');
        container.innerHTML = '';
        
        // 返回上级目录
        if (path !== '/') {
            const backDiv = document.createElement('div');
            backDiv.className = 'file-item dir';
            backDiv.innerHTML = '<span class="icon">📁</span><span class="name">.. (上级目录)</span>';
            backDiv.addEventListener('click', async () => {
                const parentPath = path.substring(0, path.lastIndexOf('/')) || '/';
                currentDir = parentPath;
                document.getElementById('currentDirPath').innerText = currentDir;
                await loadDirectory(currentDir);
            });
            container.appendChild(backDiv);
        }
        
        if (!files || files.length === 0) {
            const emptyDiv = document.createElement('div');
            emptyDiv.className = 'loading';
            emptyDiv.innerText = '目录为空';
            container.appendChild(emptyDiv);
            return;
        }
        
        // 排序：目录在前，文件在后
        const sorted = [...files].sort((a, b) => {
            if (a.isDir === b.isDir) return (a.name || '').localeCompare(b.name || '');
            return a.isDir ? -1 : 1;
        });
        
        for (const file of sorted) {
            const fileName = file.name;
            const isDir = file.isDir;
            const itemDiv = document.createElement('div');
            itemDiv.className = `file-item ${isDir ? 'dir' : 'file'}`;
            itemDiv.innerHTML = `<span class="icon">${isDir ? '📁' : '📄'}</span><span class="name">${fileName}</span>`;
            
            if (isDir) {
                itemDiv.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    const newPath = path === '/' ? '/' + fileName : path + '/' + fileName;
                    currentDir = newPath;
                    document.getElementById('currentDirPath').innerText = currentDir;
                    await loadDirectory(currentDir);
                });
            } else {
                itemDiv.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    const filePath = path === '/' ? '/' + fileName : path + '/' + fileName;
                    await viewFile(filePath);
                });
            }
            container.appendChild(itemDiv);
        }
    }

    async function loadDirectory(path) {
        const treeContainer = document.getElementById('fileTree');
        treeContainer.innerHTML = '<div class="loading">加载中...</div>';
        
        const files = await listDirectory(path);
        renderFileTree(path, files);
    }

    async function refreshFileBrowser() {
        await loadDirectory(currentDir);
        term.write(`\r\n\x1b[32m✅ 文件浏览器已刷新: ${currentDir}\x1b[0m\r\n# `);
    }

    // ========== WebSocket 连接 ==========
    let ws = null;
    let reconnectAttempts = 0;

    function updateStatus(message, isConnected) {
        const statusEl = document.getElementById('statusText');
        statusEl.innerHTML = message;
        statusEl.className = isConnected ? 'connected' : 'disconnected';
    }

    function updateSizeInfo() {
        const { cols: c, rows: r } = calcSize();
        document.getElementById('sizeInfo').innerHTML = `📐 ${c}x${r}`;
    }

    function connect() {
        const wsUrl = `ws://192.168.138.139:8082/ws?namespace=${namespace}&pod=${pod}&container=${container}`;
        ws = new WebSocket(wsUrl);

        ws.onopen = () => {
            const { cols: newCols, rows: newRows } = calcSize();
            term.resize(newCols, newRows);
            ws.send(JSON.stringify({ operation: "resize", cols: newCols, rows: newRows }));
            
            term.reset();
            term.write("\x1b[32m✅ 已连接到 " + pod + "\x1b[0m\r\n");
            term.write("\x1b[34m📁 左侧可浏览文件，点击目录进入，点击文件查看内容\x1b[0m\r\n");
            term.write("\x1b[34m🎨 右下角可切换黑白背景\x1b[0m\r\n");
            term.write("--------------------------------------------------\r\n");
            term.write("# ");
            
            reconnectAttempts = 0;
            updateStatus(`✅ 已连接 - ${namespace}/${pod}`, true);
            updateSizeInfo();
            
            // 加载文件浏览器
            loadDirectory('/');
        };

        ws.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);
                if (data.operation === "stdout") {
                    term.write(data.data);
                }
            } catch(e) {
                term.write(event.data);
            }
        };

        ws.onerror = () => {
            term.write("\r\n\x1b[31m❌ WebSocket 错误\x1b[0m\r\n");
            updateStatus('❌ WebSocket 错误', false);
        };

        ws.onclose = () => {
            if (reconnectAttempts < 5) {
                reconnectAttempts++;
                term.write(`\r\n\x1b[33m⚠️ 重连中 (${reconnectAttempts}/5)...\x1b[0m\r\n`);
                setTimeout(connect, 3000);
            } else {
                updateStatus('❌ 连接失败，请刷新页面', false);
            }
        };

        term.onData((data) => {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ operation: "stdin", data: data }));
            }
        });
    }

    // ========== 事件绑定 ==========
    let resizeTimer;
    window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
            const { cols: newCols, rows: newRows, fontSize: newFontSize } = calcSize();
            if (term.options.fontSize !== newFontSize) term.options.fontSize = newFontSize;
            term.resize(newCols, newRows);
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ operation: "resize", cols: newCols, rows: newRows }));
            }
            updateSizeInfo();
        }, 100);
    });

    document.getElementById('themeToggleBtn').addEventListener('click', toggleTheme);
    document.getElementById('refreshFileBtn').addEventListener('click', refreshFileBrowser);
    
    // ========== 启动 ==========
    initSidebar();
    connect();
    updateSizeInfo();
</script>
</body>
</html>
